[project]
name = "skills-graph"
version = "0.2.0"
description = "Skills graph with Neo4j, neomodel, and LLM-powered agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "neo4j>=6.1.0",
    "neomodel>=6.1.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
agent = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.4.0",
    "langsmith>=0.1.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
skills-seed = "scripts.seed:main"
skills-smoke = "scripts.smoke:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end tests requiring Neo4j and LLM"]
