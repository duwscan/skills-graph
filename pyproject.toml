[project]
name = "skills-graph"
version = "0.1.0"
description = "Skills graph with Neo4j and neomodel"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "neo4j>=6.1.0",
    "neomodel>=6.1.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
