services:
  cassandra:
    image: 'cassandra:latest'
    environment:
      - 'CASSANDRA_DC=dc1'
      - 'CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch'
    ports:
      - '9042'
  neo4j:
    image: 'neo4j:latest'
    environment:
      - 'NEO4J_AUTH=neo4j/notverysecret'
    ports:
      - '7687'
  typesense:
    image: 'typesense/typesense:30.1'
    environment:
      - 'TYPESENSE_API_KEY=secret'
      - 'TYPESENSE_DATA_DIR=/tmp'
    ports:
      - '8108'
