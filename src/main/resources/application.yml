spring:
  application:
    name: skills-graph
  profiles:
    default: development
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:skills_dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/skills_graph}}
    username: ${SPRING_DATASOURCE_USERNAME:skills}
    password: ${SPRING_DATASOURCE_PASSWORD:skills_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 10s
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      headers:
        Helicone-Auth: ${HELICONE_HEADER:}
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-large}
          dimensions: 1024
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  anthropic-api-key: ${ANTHROPIC_API_KEY}
  openai-api-key: ${OPENAI_API_KEY}
  helicone-api-key: ${HELICONE_API_KEY:}
  database-url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/skills_graph}}
  neo4j-uri: ${NEO4J_URI:bolt://localhost:7687}
  redis-url: ${REDIS_URL:redis://localhost:6379}
  allowed-origins: ${ALLOWED_ORIGINS:*}
  environment: ${SPRING_PROFILES_ACTIVE:development}
  version: ${APP_VERSION:0.1.0}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s
