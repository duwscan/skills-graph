spring:
  application:
    name: skills-graph
  profiles:
    default: development
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: skills_dev
  datasource:
    url: jdbc:postgresql://localhost:5433/skills_graph
    username: skills
    password: skills_dev
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 10s
  ai:
    anthropic:
      api-key: ""
      base-url: https://api.anthropic.com
      headers:
        Helicone-Auth: ""
    openai:
      api-key: ""
      embedding:
        options:
          model: text-embedding-3-large
          dimensions: 1024
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  anthropic-api-key: ${spring.ai.anthropic.api-key}
  openai-api-key: ${spring.ai.openai.api-key}
  helicone-api-key: ""
  database-url: ${spring.datasource.url}
  neo4j-uri: ${spring.neo4j.uri}
  redis-url: redis://${spring.data.redis.host}:${spring.data.redis.port}
  allowed-origins: "*"
  environment: development
  version: 0.1.0

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

server:
  port: 8080
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 30s
